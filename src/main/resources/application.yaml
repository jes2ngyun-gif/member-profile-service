# 모든 환경에서 공통으로 사용하는 설정
spring:
  application:
    name: member-profile-service

  profiles:
    default: local  # 기본 실행 환경은 local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health  # /actuator/health 외부 노출

aws:
  region: ap-northeast-2
  s3:
    bucket: member-profile-images-370835058925